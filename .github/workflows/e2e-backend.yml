name: E2E against the real backend

# Builds DIDSA-CAD's backend image and runs the e2e tests listed in tests/e2e_ci_list.txt against it
# (tests/ci_e2e.sh). Separate from the fast headless job (slow first build, depends on another repo). Not a required check yet.
# Run by hand with a different backend ref: Actions > "E2E against the real backend" > Run workflow (cad_ref).
on:
  push:   # TEMP: verification on the CI branch only; removed before merge
    branches: [ci-headless-tests]
    paths: ["tests/e2e_*.gd", ".github/workflows/e2e-backend.yml", "tests/ci_e2e.sh", "tests/e2e_ci_list.txt", "tests/expected_false_e2e.txt"]
  workflow_dispatch:
    inputs:
      cad_ref:
        description: "DIDSA-CAD branch, tag or commit to test against"
        default: main
        required: true
  pull_request:
    paths:
      - "scripts/design_table/**"
      - "scripts/mesh_identity.gd"
      - "tests/e2e_*.gd"
      - "tests/ci_e2e.sh"
      - "tests/e2e_ci_list.txt"
      - "tests/expected_false_e2e.txt"
      - ".github/workflows/e2e-backend.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN: ${{ github.workspace }}/.godot-bin/Godot_v4.7.2-stable_linux.x86_64
  CAD_API_KEY: ci-throwaway-key

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # DIDSA-CAD is a public repository: no token needed.
      - uses: actions/checkout@v4
        with:
          repository: DIDSA-UK/DIDSA-CAD
          ref: ${{ inputs.cad_ref || 'main' }}
          path: didsa-cad

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .godot-bin
          curl -sSfL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d .godot-bin
          rm godot.zip
          chmod +x "$GODOT_BIN"

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: didsa-cad/backend
          platforms: linux/amd64
          tags: didsa-cad-backend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start backend
        run: |
          docker run -d --name backend -p 8000:8000 -e CAD_API_KEY="$CAD_API_KEY" didsa-cad-backend:ci
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/docs; then echo "backend up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "backend did not come up in 60 s"; docker logs backend; exit 1

      - name: Point the tests at it
        run: |
          cat > secrets.cfg <<CFG
          [backend]
          url="http://127.0.0.1:8000"
          api_key="$CAD_API_KEY"
          CFG
          sed -i 's/^ *//' secrets.cfg
          cat secrets.cfg | sed 's/api_key=.*/api_key=***/'

      - name: E2E tests
        env:
          GODOT: ${{ env.GODOT_BIN }}
        run: tests/ci_e2e.sh

      - name: Backend log
        if: always()
        run: docker logs backend > backend.log 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e.log
            logs/
            backend.log
          if-no-files-found: ignore
